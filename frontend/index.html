<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live AI Photo Culling Dashboard</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Application Logic (app.js) -->
  <script src="app.js"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans" x-data="cullingApp()">

  <!-- Top Navigation Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between shadow-lg">
    <div class="flex items-center gap-3">
      <div class="h-3 w-3 rounded-full" :class="isConnected ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'"></div>
      <h1 class="text-xl font-bold tracking-wide">Live Culling Hub</h1>
    </div>

    <!-- Filter Tabs & Counters -->
    <div class="flex gap-2 bg-slate-900 p-1 rounded-lg border border-slate-700 text-sm font-medium">
      <button @click="filter = 'all'"
        :class="filter === 'all' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:text-white'"
        class="px-3 py-1.5 rounded-md transition-all">
        All (<span x-text="photos.length"></span>)
      </button>
      <button @click="filter = 'passed'"
        :class="filter === 'passed' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'"
        class="px-3 py-1.5 rounded-md transition-all">
        Passed (<span x-text="passedCount"></span>)
      </button>
      <button @click="filter = 'rejected'"
        :class="filter === 'rejected' ? 'bg-rose-600 text-white' : 'text-slate-400 hover:text-white'"
        class="px-3 py-1.5 rounded-md transition-all">
        Rejected (<span x-text="rejectedCount"></span>)
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 p-6 overflow-y-auto">
    <!-- Folder setting for Photos -->
    <div class="bg-gray-800 p-4 rounded-lg text-white mb-6" x-data="cullingApp()">
      <h2 class="text-lg font-bold mb-4">📁 Lightroom Folder Settings</h2>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm mb-1">Watched Folder Path:</label>
          <input type="text" x-model="watchedFolder" class="w-full bg-gray-700 p-2 rounded text-sm text-white" />
        </div>
        <div>
          <label class="block text-sm mb-1">Destination Folder Path:</label>
          <input type="text" x-model="destinationFolder" class="w-full bg-gray-700 p-2 rounded text-sm text-white" />
        </div>
      </div>
      <button @click="saveConfig()"
        class="mt-4 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm font-semibold">
        Save Folder Settings
      </button>
      <span x-show="saveSuccess" class="ml-3 text-green-400 text-sm">✓ Settings updated!</span>
    </div>
    <!-- Grid Layout for Photos -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">

      <template x-for="photo in filteredPhotos" :key="photo.filename">
        <div
          class="bg-slate-800 rounded-xl overflow-hidden border transition-all duration-200 shadow-md hover:shadow-xl hover:-translate-y-1"
          :class="photo.status === 'passed' ? 'border-emerald-500/40 hover:border-emerald-400' : 'border-rose-500/40 hover:border-rose-400'">

          <!-- Image Preview with Badge Overlay -->
          <div class="relative aspect-[3/2] bg-slate-950 overflow-hidden">
            <img :src="photo.url" :alt="photo.filename" class="w-full h-full object-cover" />

            <!-- Status Badge (Clickable to manual toggle) -->
            <button @click="togglePhotoStatus(photo)"
              class="absolute top-2 right-2 px-2.5 py-1 rounded-full text-xs font-semibold tracking-wide uppercase shadow cursor-pointer hover:opacity-80 transition-opacity"
              :class="photo.status === 'passed' ? 'bg-emerald-500/90 text-white' : 'bg-rose-500/90 text-white'"
              x-text="photo.status">
            </button>

            <!-- Filename Tag -->
            <span
              class="absolute bottom-2 left-2 bg-slate-900/80 backdrop-blur-sm text-slate-300 text-xs px-2 py-0.5 rounded font-mono truncate max-w-[80%]"
              x-text="photo.filename">
            </span>
          </div>

          <!-- AI Metrics & Scores Card Footer -->
          <div class="p-3 space-y-2 text-xs">
            <!-- Blur Metric -->
            <div class="flex justify-between items-center">
              <span class="text-slate-400 font-medium">Blur Score:</span>
              <span class="font-mono font-semibold"
                :class="photo.blurScore >= 110 ? 'text-emerald-400' : 'text-rose-400'" x-text="photo.blurScore">
              </span>
            </div>

            <!-- Eye Metric (EAR) -->
            <div class="flex justify-between items-center">
              <span class="text-slate-400 font-medium">Eye Aspect (EAR):</span>
              <span class="font-mono font-semibold"
                :class="photo.earScore >= 0.21 ? 'text-emerald-400' : 'text-rose-400'" x-text="photo.earScore">
              </span>
            </div>

            <!-- Failure Reason Tag (if rejected) -->
            <template x-if="photo.status === 'rejected' && photo.reason">
              <div class="pt-1 border-t border-slate-700/60 text-rose-400 text-[11px] italic font-medium"
                x-text="'Reason: ' + photo.reason">
              </div>
            </template>
          </div>
        </div>
      </template>

    </div>
  </main>

</body>

</html>
